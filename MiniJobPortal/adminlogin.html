<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="CSS/adminlogin.css">
    <script src="JS/ajaxhandle.js"></script>
</head>
<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <h1>JOB PORTAL</h1>
        <p>Admin Dashboard Access</p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="card">

            <h2>Admin Login</h2>

            <div class="tabs">
                <button onclick="showLogin()" id="loginTab" class="active">Login</button>
                <button onclick="showRegister()" id="regTab">Register</button>
            </div>

            <!-- LOGIN -->
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="button" onclick="adminLogin()">Login</button>
            </form>

            <!-- REGISTER -->
            <form id="registerForm" style="display:none;">
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <button type="button" onclick="adminRegister()">Register</button>
            </form>

            <p id="msg"></p>

        </div>
    </div>

</div>

<script>
function showLogin() {
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginTab").classList.add("active");
    document.getElementById("regTab").classList.remove("active");
}

function showRegister() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
    document.getElementById("regTab").classList.add("active");
    document.getElementById("loginTab").classList.remove("active");
}
</script>

</body>
</html>
