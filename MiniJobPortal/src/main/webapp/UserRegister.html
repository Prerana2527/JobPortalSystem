<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>
body {
    margin: 0;
    padding:0;
    height: 100vh;
    background: linear-gradient(to right, #667eea, #764ba2);
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
}

.register-box {
    width: 350px;
    padding: 25px;
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    color: white;
}

.form-control {
    background: transparent;
    color: white;
    border: 1px solid #ccc;
}

.form-control::placeholder {
    color: #ddd;
}

</style>

</head>
<body>

<form name='frm' action='UserRegisterServlet' method='POST'>

<div class="register-box">

    <h3 class="text-center mb-3">👤User Register</h3>

    <input type='text' name='name' placeholder="Enter Name" class="form-control m-2" required/>

    <input type='email' name='email' placeholder="Enter Email" class="form-control m-2" required/>
    
    <input type='text' name='contact' placeholder="Enter Contact" class="form-control m-2" required/>
    
    <input type='text' name='username' placeholder="Enter Username" class="form-control m-2"  onblur='checkUserExistance(this.value)' />
    <span id='s' class="ms-2" required></span>
	
    <input type='password' name='password' placeholder="Enter Password" class="form-control m-2" required/>

    <input type='submit' value='Register' class='btn btn-primary w-100 mt-2'/>
    <div class="form-group p-2 text-center">
    <span id="msg" style="color:red;"></span>
</div>

</div>

</form>
<script src='JS/AjaxHandler.js'></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
